<!DOCTYPE html>
<html>
<head>
  <title>Form Detection - Do Not Delete</title>
</head>
<body>
  <!--
    This file exists solely for Netlify form detection during static export.
    Netlify's build scanner reads these hidden forms to register them.
    Do not delete this file.
  -->

  <!-- Free Quote Form -->
  <form name="quote" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="quote" />
    <input name="bot-field" />
    <input type="text" name="name" />
    <input type="tel" name="phone" />
    <input type="email" name="email" />
    <input type="text" name="propertyType" />
    <input type="text" name="areaToInsulate" />
    <input type="text" name="squareFootage" />
    <input type="text" name="service" />
    <input type="text" name="city" />
    <input type="text" name="timeframe" />
    <textarea name="message"></textarea>
    <input type="text" name="traffic_source" />
    <input type="text" name="landing_url" />
  </form>

  <!-- Contact Form -->
  <form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="service" />
    <textarea name="message"></textarea>
    <input type="text" name="traffic_source" />
    <input type="text" name="landing_url" />
  </form>
</body>
</html>
